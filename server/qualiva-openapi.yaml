      description: Paginated directory of platform accounts with status, department, and role filtering.
      operationId: adminListUsers
      security:
        - bearerAuth: []
      x-required-roles:
        - ADMIN
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: department
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: User directory page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserDetail'
                  pagination:
                    type: object
                  stats:
                    type: object
    post:
      tags:
        - Admin Management
      summary: Provision Enterprise User Account
      description: Manually creates an employee account with a temporary password and forces reset upon first login.
      operationId: adminCreateUser
      security:
        - bearerAuth: []
      x-required-roles:
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - name
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                role:
                  type: string
                  enum: [USER, COURSE_CREATOR, MODERATOR, ADMIN]
                  default: USER
                department:
                  type: string
                temporaryPassword:
                  type: string
                phone:
                  type: string
                location:
                  type: string
      responses:
        '201':
          description: User provisioned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserSummary'
        '409':
          description: Email already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/users/{id}:
    get:
      tags:
        - Admin Management
      summary: Get Full User Profile & Records
      description: Retrieves complete user records including enrolled courses, exam submissions, and certificates.
      operationId: adminGetUserDetail
      security:
        - bearerAuth: []
      x-required-roles:
        - ADMIN
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User detail.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/UserDetail'
        '403':
          description: Restricted access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Admin Management
      summary: Update User Records & Security Flags
      description: Updates user attributes, contact details, reset lockout status, or sets a temporary password.
      operationId: adminUpdateUserDetail
      security:
        - bearerAuth: []
      x-required-roles:
        - ADMIN
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                department:
                  type: string
                phone:
                  type: string
                location:
                  type: string
                role:
                  type: string
                  enum: [USER, COURSE_CREATOR, MODERATOR, ADMIN]
                status:
                  type: string
                  enum: [ACTIVE, LOCKED, SUSPENDED, PENDING_APPROVAL]
                mustChangePassword:
                  type: boolean
                resetLockout:
                  type: boolean
                temporaryPassword:
                  type: string
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserDetail'
        '400':
          description: Self-lockout or self-demotion forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Admin Management
      summary: Permanently Remove User Account
      description: |
        Deletes a user account and cascades all associated records across both primary and backup databases.
        Dispatches an enterprise account closure email to the user. Admins cannot delete their own account.
      operationId: adminDeleteUser
      security:
        - bearerAuth: []
      x-required-roles:
        - ADMIN
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User permanently removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  deletedUser:
                    type: object
        '400':
          description: Self-deletion forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/users/{id}/status:
    patch:
      tags:
        - Admin Management
      summary: Update User Status (Lock/Suspend/Activate)
