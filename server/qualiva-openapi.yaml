  # =========================================================================
  # Assessments & Proctored Exam Engine
  # =========================================================================
  /api/v1/assessments/extract:
    post:
      tags:
        - Assessments & Exams
      summary: AI & Document Question Extraction
      description: |
        Uploads PDF, DOCX, or text file up to 50MB. Runs a 4-stage anti-malware and security verification scan,
        extracts raw text, and parses multiple-choice questions into structured JSON.
      operationId: extractQuestionsFromDocument
      security:
        - bearerAuth: []
      x-required-roles:
        - COURSE_CREATOR
        - ADMIN
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Questions successfully parsed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  filename:
                    type: string
                  questionCount:
                    type: integer
                  questions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Question'
        '400':
          description: Security alert (malicious payload detected) or unreadable document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/assessments/my-exams:
    get:
      tags:
        - Assessments & Exams
      summary: List Student Exams & Unlock Status
      description: Returns all exams for student's enrolled courses. Indicates whether 80% curriculum completion requirement is met.
      operationId: getMyExams
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Exams retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  exams:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        moduleId:
                          type: string
                        moduleCode:
                          type: string
                        moduleTitle:
                          type: string
                        title:
                          type: string
                        passingScore:
                          type: integer
                        durationMinutes:
                          type: integer
                        isUnlocked:
                          type: boolean
                        courseProgress:
                          type: integer
                        lastSubmission:
                          type: object

  /api/v1/assessments/{id}/start:
    get:
      tags:
        - Assessments & Exams
      summary: Launch Proctored Examination Session
      description: |
        Starts exam session. Enforces anti-cheat cooldowns (7-day lockout for 3 tab/focus violations).
        Draws dynamic sample of questions, prioritizing questions not seen in previous attempts,
        and strips `correctAnswer` and `explanation` from response payload.
      operationId: startExam
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Exam session initiated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  session:
                    type: object
                    properties:
                      assessmentId:
                        type: string
                      moduleId:
                        type: string
                      courseTitle:
                        type: string
                      durationMinutes:
                        type: integer
                      passingScore:
                        type: integer
                      totalPoints:
                        type: integer
                      questionIds:
                        type: array
                        items:
                          type: string
                      questions:
                        type: array
                        items:
                          $ref: '#/components/schemas/SanitizedQuestion'
        '403':
          description: Exam locked (<80% progress) or active security cooldown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Assessment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/assessments/{id}/submit:
    post:
      tags:
        - Assessments & Exams
      summary: Submit Proctored Exam Answers
      description: |
        Server-side grading, proctoring violation evaluation, and automatic cryptographic certificate issuance on pass.
        If 3 or more security violations occur, automatically disqualifies candidate and triggers a 7-day retake cooldown.
      operationId: submitExam
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - questionIds
              properties:
                answers:
                  type: object
                  additionalProperties:
                    oneOf:
                      - type: integer
                      - type: string
                      - type: array
                        items:
                          type: string
                questionIds:
                  type: array
                  items:
                    type: string
                violations:
                  type: array
                  items:
                    type: object
                disqualified:
                  type: boolean
      responses:
        '200':
          description: Examination graded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  isDisqualified:
                    type: boolean
                  message:
                    type: string
                  result:
                    type: object
                  certificate:
                    $ref: '#/components/schemas/Certificate'
        '404':
          description: Assessment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/assessments/{id}/exit:
    post:
      tags:
        - Assessments & Exams
      summary: Voluntarily Exit Exam Session
      description: Records an abandoned exam attempt in the audit trail.
      operationId: exitExam
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                questionIds:
                  type: array
                  items:
                    type: string
                answers:
                  type: object
      responses:
        '200':
          description: Exam exit acknowledged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  cooldownExpiresAt:
                    type: string
                    format: date-time

