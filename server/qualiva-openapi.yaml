  # =========================================================================
  # Admin Settings & Database Management
  # =========================================================================
  /api/v1/admin/settings/database:
    get:
      tags:
        - Admin Settings
      summary: Get Multi-Engine Database Configuration
      description: Retrieves primary and backup database connection metadata (with passwords masked), latency, and engine labels.
      operationId: adminGetDatabaseSettings
      security:
        - bearerAuth: []
      x-required-roles:
        - ADMIN
      responses:
        '200':
          description: Database settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  activeEngines:
                    type: object
                  settings:
                    type: object
    put:
      tags:
        - Admin Settings
      summary: Update Database Connection Endpoints
      description: Performs pre-flight connectivity verification, updates runtime connection proxy, and writes configuration to environment file.
      operationId: adminUpdateDatabaseSettings
      security:
        - bearerAuth: []
      x-required-roles:
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - primaryUrl
              properties:
                primaryUrl:
                  type: string
                  example: "postgresql://user:pass@ep-qualiva.neon.tech/neondb"
                backupUrl:
                  type: string
                  example: "mongodb+srv://user:pass@cluster0.mongodb.net/esmms"
      responses:
        '200':
          description: Database configuration updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  settings:
                    type: object
        '400':
          description: Connection verification failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/settings/database/test:
    post:
      tags:
        - Admin Settings
      summary: Pre-Flight Database Connection Test
      description: Tests multi-engine connectivity (PostgreSQL, MongoDB, MySQL, SQLite) without saving.
      operationId: adminTestDatabaseConnection
      security:
        - bearerAuth: []
      x-required-roles:
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  example: "postgresql://user:pass@host:5432/db"
      responses:
        '200':
          description: Connection test successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  latencyMs:
                    type: integer
                  engine:
                    type: string
        '400':
          description: Connection failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/settings/database/migrate-and-activate:
    post:
      tags:
        - Admin Settings
      summary: Zero-Data-Loss Database Migration & Promotion
      description: Tests target database, executes automated table schema migration and row synchronization, and promotes target to active primary.
      operationId: adminMigrateAndActivateDatabase
      security:
        - bearerAuth: []
      x-required-roles:
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetUrl
              properties:
                targetUrl:
                  type: string
                role:
                  type: string
                  enum: [PRIMARY, BACKUP]
                  default: PRIMARY
                shouldMigrateData:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Migration and activation completed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Pre-flight test failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Migration error; previous database remains active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

