openapi: 3.0.3
info:
  title: Qualiva - Enterprise Secure Module Management System (ESMMS) API
  description: |
    Comprehensive OpenAPI 3.x specification for the Qualiva ESMMS backend services.
    Generated strictly via comprehensive source code inspection of `server/src` for API security auditing with OWASP ZAP.
    
    Includes role-based access control (RBAC), multi-engine database proxies, granular moderator permissions,
    proctored assessment workflows, and real-time enterprise communication endpoints.
  version: 1.0.0
servers:
  - url: http://host.docker.internal:5050
    description: Local development backend server
  - url: /
    description: Current host relative path

tags:
  - name: System & Health
    description: Core platform health and gateway metadata
  - name: Authentication & Profile
    description: Dual-token authentication, 2FA OTP, Google SSO, and profile management
  - name: Course Modules
    description: Course catalog, multi-modal curriculum, and progress tracking
  - name: Course Enrollments
    description: 3-stage enrollment workflow (Application -> Creator Endorsement -> Admin Approval)
  - name: Assessments & Exams
    description: Question bank, secure document question extraction, and proctored examination engine
  - name: Certificates
    description: Cryptographic certificate verification and student certificate records
  - name: Admin Management
    description: User directory, bulk XLSX onboarding, role governance, and audit trails
  - name: Admin Settings
    description: Database engine switching, runtime hot-swap, and connection tests
  - name: Moderator Operations
    description: Operational moderator endpoints restricted by granular capabilities
  - name: Real-Time Chat & Inbox
    description: System announcements, community support desk, and direct messaging
  - name: Notifications
    description: User-level and role-targeted persistent notifications
  - name: Transfers & SLA
    description: Course transfer and deadline extension requests

paths:
  # =========================================================================
  # System & Gateway Health
  # =========================================================================
  /health:
    get:
      tags:
        - System & Health
      summary: Root Cloud Health Check
      description: Basic service liveness and uptime check used by reverse proxies and cloud container health probes.
      operationId: getCloudHealth
      responses:
        '200':
          description: Service is healthy and operational.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  uptime:
                    type: integer
                    example: 3600
                  timestamp:
                    type: string
                    format: date-time

  /api/v1/health:
    get:
      tags:
        - System & Health
      summary: API Gateway Health & Diagnostics
      description: Detailed system health diagnostics reporting uptime, system name, version, and RAM usage in megabytes.
      operationId: getApiV1Health
      responses:
        '200':
          description: Diagnostic metrics retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "online"
                  system:
                    type: string
                    example: "Enterprise Secure Module Management System (ESMMS)"
                  version:
                    type: string
                    example: "1.0.0"
                  timestamp:
                    type: string
                    format: date-time
                  uptimeSeconds:
                    type: integer
                    example: 1240
                  memoryUsageMB:
                    type: integer
                    example: 64

  /api/v1:
    get:
      tags:
        - System & Health
      summary: API Gateway Welcome & Discovery
      description: Public discovery root listing top-level service endpoint mount paths.
      operationId: getApiV1Root
      responses:
        '200':
          description: API directory listing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  documentation:
                    type: string
                  endpoints:
                    type: object
                    additionalProperties:
                      type: string

  # =========================================================================
  # Authentication & Identity Routes
  # =========================================================================
  /api/v1/auth/register:
    post:
      tags:
        - Authentication & Profile
      summary: Register New Account
      description: |
        Registers a new enterprise account. If `role` is specified as `MODERATOR`,
        the account is placed in `PENDING_APPROVAL` status awaiting administrator verification and permission assignment.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  minLength: 2
                  example: "Sarah Connor"
                email:
                  type: string
                  format: email
                  example: "sarah.connor@qualiva.io"
                password:
                  type: string
                  minLength: 8
                  example: "SecureP@ss2026!"
                department:
                  type: string
                  example: "Engineering"
                role:
                  type: string
                  enum: [USER, COURSE_CREATOR, MODERATOR, ADMIN]
                  default: USER
      responses:
        '201':
          description: User registered successfully or queued for approval.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  pendingApproval:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/UserSummary'
                  accessToken:
                    type: string
        '400':
          description: Validation error on input fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email address already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal registration error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags:
        - Authentication & Profile
      summary: Authenticate User Credentials (Step 1)
      description: |
        Verifies corporate email and password. Enforces brute-force lockout policy (locks for 15 minutes after 5 consecutive failures).
        On successful credential verification, generates and dispatches a 6-digit 2FA OTP to the user's email.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "david.kim@qualiva.io"
                password:
                  type: string
                  example: "Password123!"
      responses:
        '200':
          description: Credentials valid; 6-digit OTP passcode dispatched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  requiresOtp:
                    type: boolean
                    example: true
                  email:
                    type: string
                  mustChangePassword:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Invalid email or password, or temporary password required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account suspended or pending administrator approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User account does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '423':
          description: Account locked due to repeated failed login attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/verify-otp:
    post:
      tags:
        - Authentication & Profile
      summary: Verify 2FA OTP Passcode (Step 2)
      description: |
        Validates the 6-digit OTP code dispatched during credential login.
        Upon verification, sets an HttpOnly `esmms_refresh_token` cookie and returns a signed JWT access token.
      operationId: verifyLoginOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                  example: "david.kim@qualiva.io"
                otp:
                  type: string
                  pattern: '^[0-9]{6}$'
                  example: "582914"
      responses:
        '200':
          description: 2FA verified successfully; JWT access token returned.
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie (`esmms_refresh_token`)
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserDetail'
                  accessToken:
                    type: string
        '400':
          description: Invalid or expired OTP code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error during verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/request-otp:
    post:
      tags:
        - Authentication & Profile
      summary: Request 2FA OTP Resend
      description: Generates a new 6-digit OTP and dispatches it to the requested email.
      operationId: requestOtpResend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: "david.kim@qualiva.io"
      responses:
        '200':
          description: OTP dispatched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '404':
          description: User account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/google:
    post:
      tags:
        - Authentication & Profile
      summary: Google Single Sign-On (SSO)
      description: |
        Authenticates via Google OAuth ID token or profile object.
        Supports automatic new member onboarding, role selection, and OTP verification for newly onboarded SSO accounts.
      operationId: googleLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                credential:
                  type: string
                  description: Google ID token (JWT)
                profile:
                  type: object
                  properties:
                    email:
                      type: string
                    name:
                      type: string
                    avatar:
                      type: string
                role:
                  type: string
                  enum: [USER, COURSE_CREATOR, MODERATOR, ADMIN]
                department:
                  type: string
                otpCode:
                  type: string
      responses:
        '200':
          description: Authenticated or onboarding prompt returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  requiresOnboarding:
                    type: boolean
                  requiresOtp:
                    type: boolean
                  googleProfile:
                    type: object
                  user:
                    $ref: '#/components/schemas/UserSummary'
                  accessToken:
                    type: string
        '400':
          description: Invalid Google token or expired onboarding OTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account locked or suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication & Profile
      summary: Refresh Access Token
      description: |
        Dual-token rotation endpoint. Reads `esmms_refresh_token` from cookies,
        revokes the old session token (one-time use), generates a new session and returns a fresh JWT access token.
      operationId: refreshSessionToken
      security:
        - cookieAuth: []
      responses:
        '200':
          description: New access token generated and refresh token rotated in cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  accessToken:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserSummary'
        '401':
          description: Refresh token missing, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication & Profile
      summary: Logout & Revoke Active Session
      description: Invalidates active session hash in the database, clears the refresh token cookie, and records audit trail.
      operationId: logoutUser
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Successfully logged out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  /api/v1/auth/request-password-reset:
    post:
      tags:
        - Authentication & Profile
      summary: Request Account Password Reset
      description: Flag account for administrative credential reset and emit real-time notification to Administrators. Returns generic success to prevent email enumeration.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: "david.kim@qualiva.io"
      responses:
        '200':
          description: Reset request acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Email address missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/change-password:
    post:
      tags:
        - Authentication & Profile
      summary: Change Password / Establish Permanent Credentials
      description: Allows authenticated user to update their permanent password, clearing the `mustChangePassword` flag.
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newPassword
              properties:
                newPassword:
                  type: string
                  minLength: 6
                  example: "NewPermanentPass2026!"
      responses:
        '200':
          description: Permanent password set successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserSummary'
        '400':
          description: Password must be at least 6 characters long.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      tags:
        - Authentication & Profile
      summary: Get Current User Profile
      description: Returns profile, RBAC role, account status, and configured moderator permissions for the authenticated caller.
      operationId: getCurrentUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/UserDetail'
        '401':
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/profile:
    get:
      tags:
        - Authentication & Profile
      summary: Get Profile Alias
      description: Alias to `/api/v1/auth/me`.
      operationId: getProfileAlias
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/UserDetail'
    put:
      tags:
        - Authentication & Profile
      summary: Update Personal Profile
      description: Updates display name or profile avatar image URL.
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  example: "Sarah Connor"
                avatar:
                  type: string
                  nullable: true
                  example: "https://example.com/avatar.jpg"
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserDetail'
        '400':
          description: Invalid name or input parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # =========================================================================
  # Course Modules & Curriculum
  # =========================================================================
  /api/v1/modules:
    get:
      tags:
        - Course Modules
      summary: List Course Modules (Public Catalog)
      description: Returns active curriculum modules with caching support.
      operationId: listModules
      parameters:
        - name: department
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, DRAFT, ARCHIVED, DEPRECATED]
            default: ACTIVE
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [ACADEMY_COURSE, WORK_MODULE]
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Module catalog list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  modules:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModuleSummary'
    post:
      tags:
        - Course Modules
      summary: Create Course Module
      description: Provision a new curriculum course module in `DRAFT` status.
      operationId: createModule
      security:
        - bearerAuth: []
      x-required-roles:
        - COURSE_CREATOR
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - title
                - department
              properties:
                code:
                  type: string
                  example: "CS-401"
                title:
                  type: string
                  example: "Advanced Cloud Security Engineering"
                description:
                  type: string
                department:
                  type: string
                  example: "Information Security"
                level:
                  type: string
                  enum: [Beginner, Intermediate, Advanced]
                  default: Beginner
                duration:
                  type: string
                  example: "8 Weeks"
                type:
                  type: string
                  enum: [ACADEMY_COURSE, WORK_MODULE]
                  default: ACADEMY_COURSE
                outcomes:
                  type: array
                  items:
                    type: string
                prerequisites:
                  type: array
                  items:
                    type: string
                expiresMonths:
                  type: integer
                  default: 12
      responses:
        '201':
          description: Module created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  module:
                    $ref: '#/components/schemas/ModuleDetail'
        '400':
          description: Missing code, title, or department.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Module code already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/modules/upload-media:
    post:
      tags:
        - Course Modules
      summary: Upload Lecture Media (Video, Documents, PDFs)
      description: Multer-based multipart file upload for lesson content up to 1GB.
      operationId: uploadLessonMedia
      security:
        - bearerAuth: []
      x-required-roles:
        - COURSE_CREATOR
        - ADMIN
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Media uploaded successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  fileUrl:
                    type: string
                    example: "/uploads/lessons/1740000000-lecture.mp4"
                  filename:
                    type: string
                  originalName:
                    type: string
                  size:
                    type: integer
                  mimetype:
                    type: string
        '400':
          description: No file uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/modules/my-courses:
    get:
      tags:
        - Course Modules
      summary: Get Enrolled Courses for Current Student
      description: Returns all enrolled courses, progress percentages, and last active learning position for the caller.
      operationId: getMyEnrolledCourses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Enrolled courses retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  assignments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        moduleId:
                          type: string
                        code:
                          type: string
                        title:
                          type: string
                        progress:
                          type: integer
                        status:
                          type: string
                        dueDate:
                          type: string
                          format: date-time
                        completedLessonsCount:
                          type: integer
                        totalLessons:
                          type: integer
                        lastActive:
                          type: object

  /api/v1/modules/{id}:
    get:
      tags:
        - Course Modules
      summary: Get Single Module with Curriculum
      description: Returns full course metadata, sections, lessons, and assessment thresholds.
      operationId: getModuleById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Full curriculum retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  module:
                    $ref: '#/components/schemas/ModuleDetail'
        '404':
          description: Module not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Course Modules
      summary: Update Course Module
      description: Updates course title, description, outcomes, prerequisites, or status.
      operationId: updateModule
      security:
        - bearerAuth: []
      x-required-roles:
        - COURSE_CREATOR
        - ADMIN
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Module updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  module:
                    $ref: '#/components/schemas/ModuleDetail'
        '403':
          description: Forbidden role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Course Modules
      summary: Delete Course Module
      description: Deletes a module and cascades to all child sections and lessons.
      operationId: deleteModule
      security:
        - bearerAuth: []
      x-required-roles:
        - COURSE_CREATOR
        - ADMIN
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Module deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '403':
          description: Forbidden role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/modules/{id}/progress:
    get:
      tags:
        - Course Modules
      summary: Get Student Module Progress
      description: Retrieves the current student's progress and completed lesson keys for a specific module.
      operationId: getModuleProgress
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Progress statistics retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  enrolled:
                    type: boolean
                  progress:
                    type: integer
                  status:
                    type: string
                  dueDate:
                    type: string
                    format: date-time
                  completedLessons:
                    type: array
                    items:
                      type: string
                  lastActive:
                    type: object

  /api/v1/modules/lessons/{lessonId}/complete:
    post:
      tags:
        - Course Modules
      summary: Complete Lecture / Save Playback Position
      description: |
        Marks a lesson completed or saves the current playback timestamp.
