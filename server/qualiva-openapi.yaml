  # Cryptographic Certificates
  # =========================================================================
  /api/v1/certificates/verify/{code}:
    get:
      tags:
        - Certificates
      summary: Public Certificate Verification
      description: Publicly verifies the cryptographic authenticity and integrity of a Qualiva completion certificate via SHA-256 hash.
      operationId: verifyCertificateByCode
      parameters:
        - name: code
          in: path
          required: true
          description: Certificate verification identifier (e.g. ESMMS-CERT-2026-A1B2C3)
          schema:
            type: string
            example: "ESMMS-CERT-2026-F9B2C1"
      responses:
        '200':
          description: Certificate verified authentic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  certificate:
                    $ref: '#/components/schemas/Certificate'
        '404':
          description: Certificate code does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/certificates/my-certificates:
    get:
      tags:
        - Certificates
      summary: Get Student Issued Certificates
      description: Returns all verified completion certificates issued to the authenticated student.
      operationId: getMyCertificates
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Certificate list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                  certificates:
                    type: array
                    items:
                      $ref: '#/components/schemas/Certificate'

