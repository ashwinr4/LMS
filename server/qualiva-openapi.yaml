  /api/v1/admin/users/bulk-import:
    post:
      tags:
        - Admin Management
      summary: Bulk XLSX / CSV Employee Import
      description: |
        Supports dry-run validation mode (`dryRun=true`) and live execution (`dryRun=false`).
        Accepts multipart file or JSON array, validates email format and duplicate records.
      operationId: adminBulkImportUsers
      security:
        - bearerAuth: []
      x-required-roles:
        - ADMIN
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                dryRun:
                  type: boolean
                  default: true
                defaultRole:
                  type: string
                  default: USER
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
                  default: true
                defaultRole:
                  type: string
                  default: USER
                users:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Dry-run validation report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  mode:
                    type: string
                    example: "DRY_RUN"
                  summary:
                    type: object
                  rows:
                    type: array
                    items:
                      type: object
        '201':
          description: Users imported in live mode.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  mode:
                    type: string
                    example: "EXECUTE"
