        - bearerAuth: []
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - moduleId
                - sectionIdx
                - lessonIdx
              properties:
                moduleId:
                  type: string
                sectionIdx:
                  type: integer
                lessonIdx:
                  type: integer
                timestamp:
                  type: number
                markAsFinished:
                  type: boolean
      responses:
        '200':
          description: Lesson progress saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  progress:
                    type: integer
