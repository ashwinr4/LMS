  # =========================================================================
  # Real-Time Chat & Communications
  # =========================================================================
  /api/v1/chat/messages:
    get:
      tags:
        - Real-Time Chat & Inbox
      summary: Fetch Chat Messages
      description: Returns messages for `ANNOUNCEMENT`, `COMMUNITY` (Support Desk), or `DIRECT` 1-on-1 channels.
      operationId: getChatMessages
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [ANNOUNCEMENT, COMMUNITY, DIRECT]
            default: ANNOUNCEMENT
        - name: contactId
          in: query
          required: false
          schema:
            type: string
        - name: audit
          in: query
          required: false
          schema:
            type: string
            enum: ['true', 'false']
            default: 'false'
      responses:
        '200':
          description: Message history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatMessage'
    post:
      tags:
        - Real-Time Chat & Inbox
      summary: Send Chat Message / Announcement
      description: |
        Dispatches message and emits live WebSocket event.
        `ANNOUNCEMENT` broadcasts are strictly restricted to Administrators.
        Applies server-side XSS sanitation to message content.
      operationId: postChatMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [ANNOUNCEMENT, COMMUNITY, DIRECT]
                  default: COMMUNITY
                content:
                  type: string
                  example: "Hello team, please review the latest security protocol."
                recipientId:
                  type: string
                fileUrl:
                  type: string
                fileName:
                  type: string
                fileType:
                  type: string
                fileSize:
                  type: integer
                replyTo:
                  type: object
      responses:
        '201':
          description: Message posted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    $ref: '#/components/schemas/ChatMessage'
        '400':
          description: Empty content or missing recipient in direct message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non-admin attempted to post announcement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/chat/upload:
    post:
      tags:
        - Real-Time Chat & Inbox
      summary: Upload Chat File Attachment
      description: Multer-based file upload up to 50MB for chat attachments.
      operationId: uploadChatFile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: File uploaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  file:
                    type: object
                    properties:
                      fileUrl:
                        type: string
                      fileName:
                        type: string
                      fileType:
                        type: string
                      fileSize:
                        type: integer
        '400':
          description: No file uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/chat/contacts:
    get:
      tags:
        - Real-Time Chat & Inbox
      summary: List Chat Contacts with Unread Badges
      description: Returns potential chat contacts with individual unread message count badges.
      operationId: getChatContacts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Contacts retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  contacts:
                    type: array
                    items:
                      type: object

  /api/v1/chat/community/threads:
    get:
      tags:
        - Real-Time Chat & Inbox
      summary: List Support Desk User Threads (Staff Only)
      description: Returns aggregated community support threads for Administrators and Moderators.
      operationId: getCommunityThreads
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Support threads.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  threads:
                    type: array
                    items:
                      type: object
        '403':
          description: Forbidden (Staff access required).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/chat/unread-count:
    get:
      tags:
        - Real-Time Chat & Inbox
      summary: Get Aggregate Unread Message Counts
      description: Returns badge counts for unread direct messages, announcements, and support desk tickets.
      operationId: getChatUnreadCount
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unread counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  directCount:
                    type: integer
                  announcementCount:
                    type: integer
                  communityCount:
                    type: integer

  /api/v1/chat/read-announcements:
    post:
      tags:
        - Real-Time Chat & Inbox
      summary: Mark Global Announcements as Read
      description: Updates the caller's last announcement read timestamp.
      operationId: markAnnouncementsRead
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Announcements marked read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  /api/v1/chat/notifications:
    get:
      tags:
        - Real-Time Chat & Inbox
      summary: Get Mailbox Dropdown Feed
      description: Returns combined preview list of recent announcements, support tickets, and direct messages for the top navigation bar.
      operationId: getChatNotificationsFeed
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notification feed items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  announcements:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatMessage'
                  community:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatMessage'
                  direct:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatMessage'

  # =========================================================================
  # System Notifications
  # =========================================================================
  /api/v1/notifications:
    get:
      tags:
        - Notifications
      summary: List Persistent Notifications
      description: Returns in-app notifications targeted to the caller's user ID or RBAC role.
      operationId: getNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        '200':
          description: Notifications list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  unreadCount:
                    type: integer
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'

  /api/v1/notifications/{id}/read:
    patch:
      tags:
        - Notifications
      summary: Mark Notification as Read
      description: Marks a single notification as read if owned by the caller or authorized by role.
      operationId: markNotificationAsRead
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification marked read.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  notification:
                    $ref: '#/components/schemas/Notification'
        '403':
          description: Unauthorized to mark this notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notification not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/notifications/read-all:
    patch:
      tags:
        - Notifications
      summary: Mark All Notifications as Read
      description: Marks all active notifications for the current user and role as read.
      operationId: markAllNotificationsAsRead
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All notifications marked read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  # =========================================================================
  # Course Transfers & SLA Extensions
  # =========================================================================
  /api/v1/transfers:
    get:
      tags:
        - Transfers & SLA
      summary: List Course Transfer & SLA Requests
      description: Lists transfer and SLA extension requests with status counts.
      operationId: listTransfers
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, PENDING, APPROVED, REJECTED]
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, COURSE_TRANSFER, SLA_EXTENSION, DEPARTMENT_TRANSFER]
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Transfers list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  counts:
                    type: object
                    properties:
                      pending:
                        type: integer
                      approved:
                        type: integer
                      rejected:
                        type: integer
                      total:
                        type: integer
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransferRequest'
    post:
      tags:
        - Transfers & SLA
      summary: Submit Course Transfer or SLA Extension Request
      description: Student submits request to change tracks, request SLA deadline extension, or relocate department.
      operationId: createTransfer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                type:
                  type: string
                  enum: [COURSE_TRANSFER, SLA_EXTENSION, DEPARTMENT_TRANSFER]
                  default: COURSE_TRANSFER
                courseId:
                  type: string
                targetCourseId:
                  type: string
                fromDepartment:
                  type: string
                toDepartment:
                  type: string
                reason:
                  type: string
                  example: "Requesting 14-day SLA deadline extension due to medical leave."
                requestedDays:
                  type: integer
                  default: 14
      responses:
        '201':
          description: Transfer request created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  transfer:
                    $ref: '#/components/schemas/TransferRequest'
        '400':
          description: Reason is mandatory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/transfers/{id}/approve:
    patch:
      tags:
        - Transfers & SLA
      summary: Authorize / Approve Transfer Request
      description: |
        Authorized by ADMIN or MODERATOR roles. If the request is an SLA extension,
        automatically increments the student's assignment `dueDate` by `requestedDays`.
      operationId: approveTransfer
      security:
        - bearerAuth: []
      x-required-roles:
        - ADMIN
        - MODERATOR
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  example: "Authorized SLA extension for 14 days."
      responses:
        '200':
          description: Request approved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  transfer:
                    $ref: '#/components/schemas/TransferRequest'
        '400':
          description: Request is not in PENDING status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Transfer request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/transfers/{id}/reject:
    patch:
      tags:
        - Transfers & SLA
      summary: Decline Transfer or SLA Extension Request
      description: Authorized by ADMIN or MODERATOR roles. Rejects request and records review notes.
      operationId: rejectTransfer
      security:
        - bearerAuth: []
      x-required-roles:
        - ADMIN
        - MODERATOR
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: "Extension cannot exceed maximum cohort timeline."
      responses:
        '200':
          description: Request rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  transfer:
                    $ref: '#/components/schemas/TransferRequest'
        '403':
          description: Forbidden role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Transfer request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

# =========================================================================
# Reusable Components & Schemas
# =========================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JSON Web Token passed in the `Authorization` header as `Bearer <token>`.
        Payload contains `sub` (User UUID), `email`, `role`, `status`, and `department`.
    cookieAuth:
      type: apiKey
      in: cookie
      name: esmms_refresh_token
      description: |
        HttpOnly cookie containing the cryptographic refresh token used exclusively by `/api/v1/auth/refresh` and `/api/v1/auth/logout`.

  schemas:
    StandardSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully."

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "Invalid request payload."
        details:
          type: array
          items:
            type: string

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, MODERATOR, COURSE_CREATOR, USER]
        status:
          type: string
          enum: [ACTIVE, LOCKED, SUSPENDED, PENDING_APPROVAL]
        department:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
        requestedRole:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    UserDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, MODERATOR, COURSE_CREATOR, USER]
        status:
          type: string
          enum: [ACTIVE, LOCKED, SUSPENDED, PENDING_APPROVAL]
        department:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
        mustChangePassword:
          type: boolean
        failedLoginAttempts:
          type: integer
        lockUntil:
          type: string
          format: date-time
          nullable: true
        lastActive:
          type: string
          format: date-time
        requestedRole:
          type: string
          nullable: true
        moderatorPermissions:
          $ref: '#/components/schemas/ModeratorPermissions'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ModeratorPermissions:
      type: object
      properties:
        users:
          type: object
          properties:
            view:
              type: boolean
            manage:
              type: boolean
        courses:
          type: object
          properties:
            view:
              type: boolean
            manage:
              type: boolean
        enrollments:
          type: object
          properties:
            view:
              type: boolean
            manage:
              type: boolean
            approve:
              type: boolean
        assessments:
          type: object
          properties:
            view:
              type: boolean
            manage:
              type: boolean
        transfers:
          type: object
          properties:
            view:
              type: boolean
            manage:
              type: boolean
            approve:
              type: boolean
        messages:
          type: object
          properties:
            view:
              type: boolean
            manage:
              type: boolean
        auditLogs:
          type: object
          properties:
            view:
              type: boolean

    ModuleSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: "SEC-101"
        title:
          type: string
        description:
          type: string
          nullable: true
        department:
          type: string
        level:
          type: string
        duration:
          type: string
          nullable: true
        instructorName:
          type: string
          nullable: true
        type:
          type: string
        status:
          type: string
        rating:
          type: number
        ratingCount:
          type: integer
        outcomes:
          type: array
          items:
            type: string
        prerequisites:
          type: array
          items:
            type: string
        expiresMonths:
          type: integer
        expiresAt:
          type: string
          format: date-time
          nullable: true
        sectionCount:
          type: integer
        enrolledCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    ModuleDetail:
      allOf:
        - $ref: '#/components/schemas/ModuleSummary'
        - type: object
          properties:
            sections:
              type: array
              items:
                $ref: '#/components/schemas/Section'

    Section:
      type: object
      properties:
        id:
          type: string
          format: uuid
        moduleId:
          type: string
        title:
          type: string
        order:
          type: integer
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'

    Lesson:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sectionId:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [VIDEO, YOUTUBE, TEXT, MARKDOWN, DOCUMENT, QUIZ]
        videoUrl:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        documentName:
          type: string
          nullable: true
        duration:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        order:
          type: integer

    Question:
      type: object
      properties:
        id:
          type: string
