# Qualiva LMS — Render Infrastructure as Code (Blueprint)
# Deploying Full-Stack Monorepo: Node.js/Express API + Vite/React Static Site

version: "1"

services:
  # ---------------------------------------------------------
  # BACKEND WEB SERVICE
  # ---------------------------------------------------------
  - type: web
    name: qualiva-backend
    runtime: node
    rootDir: server
    plan: starter # Render free or starter tier
    region: oregon # or frankfurt, singapore, etc.
    buildCommand: npm install && npx prisma generate
    startCommand: node src/server.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false # Set to your deployed Render frontend domain (e.g. https://qualiva-frontend.onrender.com)
      - key: DATABASE_URL
        sync: false # Set your managed PostgreSQL / CockroachDB / MySQL connection string
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false # Optional: Google Cloud OAuth Web Client ID
      - key: GOOGLE_CLIENT_SECRET
        sync: false # Optional: Google Cloud OAuth Client Secret
      - key: GEMINI_API_KEY
        sync: false # Optional: AI generation features
      - key: BACKEND_URL
        sync: false # Set to your deployed Render backend domain (e.g. https://qualiva-backend.onrender.com)
      - key: ADDITIONAL_ALLOWED_ORIGINS
        sync: false # Optional: Custom domains (e.g. https://app.yourdomain.com,https://qualiva.com)
      - key: UPLOAD_DIR
        value: /var/data/uploads # Mount path for persistent disk
      - key: BREVO_API_KEY
        sync: false # Recommended for Render Free Tier: Brevo REST API Key (xkeysib-...) operates over Port 443 HTTPS, bypassing Render Free Tier SMTP port blocking
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: 587 # Note: On Render Free Tier, use BREVO_API_KEY (Port 443) or SMTP_PORT=2525
      - key: SMTP_USER
        sync: false # Brevo SMTP login identifier (e.g. bf6cd9001@smtp-brevo.com from app.brevo.com/settings/keys/smtp)
      - key: SMTP_PASS
        sync: false # Brevo master SMTP key (xsmtpsib-...)
      - key: SMTP_FROM
        sync: false # Verified sender email in Brevo Senders console (e.g. "Qualiva Security" <sender@yourdomain.com>)
    # Persistent disk volume ensures uploaded videos, PDFs, and chat attachments survive redeployments:
    disk:
      name: qualiva-uploads
      mountPath: /var/data/uploads
      sizeGB: 10

  # ---------------------------------------------------------
  # FRONTEND STATIC SITE
  # ---------------------------------------------------------
  - type: static
    name: qualiva-frontend
    rootDir: client
    buildCommand: npm install && npm run build
    publishPath: dist
    autoDeploy: true
    routes:
      # SPA rewrite rule — fallback all direct route queries to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: data: https:; connect-src 'self' https: wss: https://accounts.google.com; frame-src 'self' https://accounts.google.com https://www.youtube.com https://youtube.com blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';"
    envVars:
      - key: VITE_API_URL
        sync: false # Set to your deployed Render backend URL (e.g. https://qualiva-backend.onrender.com/api/v1)
      - key: VITE_STORAGE_URL
        sync: false # Optional: Match backend host for media streaming (e.g. https://qualiva-backend.onrender.com)
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false # Optional: Match backend GOOGLE_CLIENT_ID
